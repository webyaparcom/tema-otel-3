<style>
  /* ust-kayan-gizle — Kaydırma yönüne göre yer açan menü (incelen değil, tamamen çekilen): uzun okumada ekranın tamamı içeriğe kalır, yukarı hareketle anında döner. */
  .modulex-ust-kayan-gizle { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-ust-kayan-gizle *, .modulex-ust-kayan-gizle *::before, .modulex-ust-kayan-gizle *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-ust-kayan-gizle :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-ust-kayan-gizle :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-ust-kayan-gizle :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }

  :where(.modulex-ust-kayan-gizle) img { height: auto; }

  .modulex-ust-kayan-gizle :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-ust-kayan-gizle :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }

  .modulex-ust-kayan-gizle-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-ust-kayan-gizle-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-ust-kayan-gizle-dugme:hover { transform: translateY(-2px); }
  .modulex-ust-kayan-gizle-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-ust-kayan-gizle-dugme--ikincil:hover { border-color: --accent--; }

  .modulex-ust-kayan-gizle { position: relative; z-index: 900; }
  .modulex-ust-kayan-gizle-logo { display: inline-flex; flex: 0 1 auto; min-width: 0; align-items: center; color: inherit; text-decoration: none; }
  /* dar ekranda geniş logo/uzun ad çubuğu taşırmasın: logo daralır (img max-width 100%), ad sarar */
  .modulex-ust-kayan-gizle-logo img { width: auto; max-height: --logoH--; }
  .modulex-ust-kayan-gizle-ad { font-family: var(--mx-font-heading, inherit); font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .modulex-ust-kayan-gizle-oge { position: relative; display: inline-flex; align-items: center; min-height: 44px; color: inherit; font-weight: 600; text-decoration: none; transition: color 0.2s ease, background 0.2s ease; }
  .modulex-ust-kayan-gizle-oge:hover, .modulex-ust-kayan-gizle-oge[aria-current="page"] { color: --accentInk--; }
  .modulex-ust-kayan-gizle-cta { display: inline-flex; flex: none; align-items: center; gap: 6px; min-height: 44px; padding: 8px 18px; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; white-space: nowrap; transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .modulex-ust-kayan-gizle-cta:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -12px --accent--; }
  .modulex-ust-kayan-gizle-cta .material-symbols-outlined, .modulex-ust-kayan-gizle-tel .material-symbols-outlined, .modulex-ust-kayan-gizle-posta .material-symbols-outlined { font-size: 18px; }
  .modulex-ust-kayan-gizle-tel, .modulex-ust-kayan-gizle-posta { display: inline-flex; align-items: center; gap: 6px; color: inherit; text-decoration: none; white-space: nowrap; }
  .modulex-ust-kayan-gizle-tel:hover, .modulex-ust-kayan-gizle-posta:hover { color: --accentInk--; }
  .modulex-ust-kayan-gizle-dil:empty { display: none; }
  .modulex-ust-kayan-gizle-ac { display: none; align-items: center; gap: 10px; min-width: 46px; min-height: 46px; padding: 0 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: inherit; font: inherit; font-weight: 700; }
  .modulex-ust-kayan-gizle-ac-ikon { display: grid; gap: 4px; width: 20px; }
  .modulex-ust-kayan-gizle-ac-ikon span { display: block; height: 2px; border-radius: 2px; background: currentColor; transition: transform 0.3s ease, opacity 0.3s ease; }
  .modulex-ust-kayan-gizle--acik .modulex-ust-kayan-gizle-ac-ikon span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .modulex-ust-kayan-gizle--acik .modulex-ust-kayan-gizle-ac-ikon span:nth-child(2) { opacity: 0; }
  .modulex-ust-kayan-gizle--acik .modulex-ust-kayan-gizle-ac-ikon span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
  .modulex-ust-kayan-gizle-kapat { display: inline-grid; place-items: center; width: 46px; height: 46px; border: 1px solid --cizgi--; border-radius: 50%; background: transparent; color: inherit; }
  .modulex-ust-kayan-gizle-perde { position: fixed; inset: 0; z-index: 1; background: color-mix(in srgb, --text-- 45%, transparent); animation: modulex-ust-kayan-gizle-sol 0.3s ease both; }
  @keyframes modulex-ust-kayan-gizle-sol { from { opacity: 0; } to { opacity: 1; } }

  .modulex-ust-kayan-gizle-panel { display: grid; gap: 14px; }
  @media (max-width: 1024px) {
    .modulex-ust-kayan-gizle--js .modulex-ust-kayan-gizle-nav, .modulex-ust-kayan-gizle--js .modulex-ust-kayan-gizle-genis { display: none; }
    .modulex-ust-kayan-gizle--js .modulex-ust-kayan-gizle-ac { display: inline-flex; }
    .modulex-ust-kayan-gizle-panel { position: absolute; inset-inline: 0; inset-block-start: 100%; padding: 16px 20px 24px; border-block-end: 1px solid --cizgi--; background: --bg--; box-shadow: 0 24px 40px -28px color-mix(in srgb, --text-- 55%, transparent); animation: modulex-ust-kayan-gizle-in 0.3s ease both; }
    .modulex-ust-kayan-gizle-pliste { display: grid; }
    .modulex-ust-kayan-gizle-pliste .modulex-ust-kayan-gizle-oge { width: 100%; min-height: 50px; border-block-end: 1px solid --cizgi--; font-size: 1.05rem; }
    .modulex-ust-kayan-gizle-palt { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  }
  @media (min-width: 1025px) {
    .modulex-ust-kayan-gizle-panel { display: none !important; }
  }
  @keyframes modulex-ust-kayan-gizle-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  /* site kabuğu header modüllerini <div id="header"> içine koyar: sticky yalnız o kutuda kalırdı → bu modülü taşıyan kabuk yapışır (modül kendi de sticky: başka kabukta yedek) */
  #header:has(> .modulex-ust-kayan-gizle) { position: sticky; inset-block-start: 0; z-index: 960; }
  .modulex-ust-kayan-gizle.modulex-ust-kayan-gizle { position: sticky; inset-block-start: 0; z-index: 960; border-block-end: 1px solid --cizgi--; transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s ease; }
  .modulex-ust-kayan-gizle--gizli { transform: translateY(-100%); }
  .modulex-ust-kayan-gizle--golge { box-shadow: 0 14px 34px -26px color-mix(in srgb, --text-- 70%, transparent); }
  .modulex-ust-kayan-gizle-cubuk { display: flex; align-items: center; justify-content: space-between; gap: 14px 30px; min-height: 72px; }
  .modulex-ust-kayan-gizle-isaret { display: flex; flex-wrap: wrap; gap: 4px 8px; }
  .modulex-ust-kayan-gizle-ioge { display: inline-flex; align-items: center; min-height: 44px; padding-inline: 10px; color: inherit; font-weight: 600; text-decoration: none; background-image: linear-gradient(transparent 58%, color-mix(in srgb, --accent-- 30%, transparent) 58%, color-mix(in srgb, --accent-- 30%, transparent) 84%, transparent 84%); background-position: 0 0; background-repeat: no-repeat; background-size: 0 100%; transition: background-size 0.35s ease; }
  [dir="rtl"] .modulex-ust-kayan-gizle-ioge { background-position: 100% 0; }
  .modulex-ust-kayan-gizle-ioge:hover, .modulex-ust-kayan-gizle-ioge:focus-visible, .modulex-ust-kayan-gizle-ioge[aria-current="page"] { background-size: 100% 100%; }
  .modulex-ust-kayan-gizle-ioge[aria-current="page"] { font-weight: 800; }
  .modulex-ust-kayan-gizle-cubuk > .modulex-ust-kayan-gizle-son { display: flex; align-items: center; gap: 12px; }
  .modulex-ust-kayan-gizle-genis { display: flex; align-items: center; gap: 12px; }
  .modulex-ust-kayan-gizle-goster { position: absolute; inset-block-start: 100%; inset-inline-end: clamp(16px, 4vw, 40px); display: inline-grid; place-items: center; width: 54px; height: 30px; padding: 0; border: 1px solid --cizgi--; border-block-start: 0; border-end-start-radius: 14px; border-end-end-radius: 14px; background-color: --bg--; color: inherit; box-shadow: 0 10px 20px -14px color-mix(in srgb, --text-- 60%, transparent); animation: modulex-ust-kayan-gizle-sark 0.35s ease 0.2s both; }
  @keyframes modulex-ust-kayan-gizle-sark { from { transform: translateY(-100%); } to { transform: none; } }
  .modulex-ust-kayan-gizle-goster:hover { color: --accentInk--; }
  @media (max-width: 1024px) {
    .modulex-ust-kayan-gizle-cubuk { min-height: 60px; }
    .modulex-ust-kayan-gizle:not(.modulex-ust-kayan-gizle--js) .modulex-ust-kayan-gizle-cubuk { flex-wrap: wrap; }
  }
  @media (max-width: 768px) {
    .modulex-ust-kayan-gizle-goster { width: 46px; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-kayan-gizle :is(.modulex-ust-kayan-gizle-baslik, .modulex-ust-kayan-gizle-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-kayan-gizle-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-ust-kayan-gizle { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ust-kayan-gizle *, .modulex-ust-kayan-gizle *::before, .modulex-ust-kayan-gizle *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ust-kayan-gizle";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const cekmece = (s, P) => {
          const ac = s.querySelector("." + P + "-ac");
          const panel = ac ? document.getElementById(ac.getAttribute("aria-controls")) : null;
          if (!ac || !panel) return;
          s.classList.add(P + "--js");
          const perde = s.querySelector("." + P + "-perde");
          const modal = panel.getAttribute("aria-modal") === "true";
          const kok = document.documentElement;
          const kapa = (odak) => {
            if (panel.hidden) return;
            panel.hidden = true;
            if (perde) perde.hidden = true;
            ac.setAttribute("aria-expanded", "false");
            s.classList.remove(P + "--acik");
            if (modal) kok.style.overflow = "";
            if (odak) ac.focus();
          };
          const aci = () => {
            panel.hidden = false;
            if (perde) perde.hidden = false;
            ac.setAttribute("aria-expanded", "true");
            s.classList.add(P + "--acik");
            if (modal) kok.style.overflow = "hidden";
            const ilk = panel.querySelector("a[href], button");
            if (ilk) ilk.focus();
          };
          ac.addEventListener("click", () => (panel.hidden ? aci() : kapa(true)));
          panel.addEventListener("click", (e) => {
            if (e.target.closest("." + P + "-kapat")) kapa(true);
            else if (e.target.closest("a[href]")) kapa(false);
          });
          if (perde) perde.addEventListener("click", () => kapa(true));
          document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !panel.hidden) kapa(true); });
          if (modal) {
            panel.addEventListener("keydown", (e) => {
              if (e.key !== "Tab") return;
              const o = [...panel.querySelectorAll("a[href], button:not([disabled])")].filter((x) => x.offsetParent !== null);
              if (!o.length) return;
              if (e.shiftKey && document.activeElement === o[0]) { e.preventDefault(); o[o.length - 1].focus(); }
              else if (!e.shiftKey && document.activeElement === o[o.length - 1]) { e.preventDefault(); o[0].focus(); }
            });
          }
          const g = Number(ac.dataset.genis);
          if (g && window.matchMedia) window.matchMedia(`(min-width: ${g}px)`).addEventListener("change", (m) => { if (m.matches) kapa(false); });
        };
    const gizle = (s, P) => {
        const goster = s.querySelector("." + P + "-goster");
        let son = window.scrollY || 0;
        let b = false;
        const ayarla = (g) => { s.classList.toggle(P + "--gizli", g); if (goster) goster.hidden = !g; };
        const u = () => {
          b = false;
          const y = window.scrollY || 0;
          const sinir = s.offsetHeight || 80;
          if (!s.classList.contains(P + "--acik") && !s.contains(document.activeElement)) {
            if (y > son + 4 && y > sinir) ayarla(true);
            else if (y < son - 4 || y <= sinir) ayarla(false);
          }
          s.classList.toggle(P + "--golge", y > 4);
          son = y;
        };
        window.addEventListener("scroll", () => { if (!b) { b = true; requestAnimationFrame(u); } }, { passive: true });
        s.addEventListener("focusin", () => ayarla(false));
        if (goster) goster.addEventListener("click", () => { ayarla(false); const a = s.querySelector("a[href]"); if (a) a.focus(); });
        u();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      cekmece(s, P, az);
      gizle(s, P, az);
    });
  })();
</script>
