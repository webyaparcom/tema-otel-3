<section class="modulex-iletisim-harita-perde{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-iletisim-harita-perde-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* iletisim-harita-perde — iletisim-harita-ust / -yan / form-harita haritayı (ya da yer tutucuyu) sayfa açılır açılmaz basar; bu modül haritayı RIZA İLE yükler: iframe JS'le yalnız tıklamada kurulur (haritaPerde), JS yoksa düğme gizli kalır ve yalnız dış bağlantı çalışır. */
  .modulex-iletisim-harita-perde { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-iletisim-harita-perde *, .modulex-iletisim-harita-perde *::before, .modulex-iletisim-harita-perde *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-iletisim-harita-perde :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-iletisim-harita-perde :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-iletisim-harita-perde :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-iletisim-harita-perde :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-iletisim-harita-perde img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-iletisim-harita-perde) img { height: auto; }
  .modulex-iletisim-harita-perde [hidden] { display: none !important; }
  .modulex-iletisim-harita-perde :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-iletisim-harita-perde :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-iletisim-harita-perde-ic { max-width: --max--; margin-inline: auto; }
  .modulex-iletisim-harita-perde-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-iletisim-harita-perde--bassiz .modulex-iletisim-harita-perde-bas { display: none; }
  .modulex-iletisim-harita-perde-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-iletisim-harita-perde-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-iletisim-harita-perde-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-iletisim-harita-perde-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-iletisim-harita-perde-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-iletisim-harita-perde-dugme:hover { transform: translateY(-2px); }
  .modulex-iletisim-harita-perde-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-iletisim-harita-perde-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-iletisim-harita-perde-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-iletisim-harita-perde-sahne { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: clamp(24px, 4vw, 60px); align-items: stretch; }
  .modulex-iletisim-harita-perde-sahne--tek { grid-template-columns: minmax(0, 1fr); }
  .modulex-iletisim-harita-perde-bilgi { display: grid; align-content: start; gap: 16px; min-width: 0; }
  .modulex-iletisim-harita-perde-pliste { display: grid; margin-block-start: 8px; border-block-start: 1px solid --cizgi--; }
  .modulex-iletisim-harita-perde-psat { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 2px 14px; padding-block: 14px; border-block-end: 1px solid --cizgi--; transition: padding 0.25s ease; }
  .modulex-iletisim-harita-perde-psat:hover { padding-inline-start: 6px; }
  .modulex-iletisim-harita-perde-psat .modulex-iletisim-harita-perde-kikon { grid-row: span 2; width: 42px; height: 42px; border-radius: 50%; font-size: 21px; }
  .modulex-iletisim-harita-perde-hk { display: grid; align-content: start; gap: 12px; min-width: 0; }
  .modulex-iletisim-harita-perde-perde { position: relative; overflow: hidden; min-block-size: clamp(320px, 34vw, 460px); margin: 0; border-radius: --yuvarlak--; background-color: --kartBg--; isolation: isolate; }
  .modulex-iletisim-harita-perde-sokak { position: absolute; inset: -10%; background-color: color-mix(in srgb, --accent-- 6%, --kartBg--); background-image: radial-gradient(circle at 62% 36%, color-mix(in srgb, --accent-- 22%, transparent) 0 11%, transparent 12%), repeating-linear-gradient(35deg, transparent 0 46px, color-mix(in srgb, --text-- 9%, transparent) 46px 52px), repeating-linear-gradient(-55deg, transparent 0 70px, color-mix(in srgb, --text-- 7%, transparent) 70px 74px); filter: blur(1.5px); transform: scale(1.04); transition: filter 0.5s ease, transform 0.8s ease, opacity 0.5s ease; }
  .modulex-iletisim-harita-perde-perde:hover .modulex-iletisim-harita-perde-sokak { filter: blur(0); transform: scale(1.08); }
  .modulex-iletisim-harita-perde-hpin { position: absolute; inset-block-start: 26%; inset-inline-start: 56%; color: --accentInk--; font-size: 52px; animation: modulex-iletisim-harita-perde-sallan 3s ease-in-out infinite; transition: opacity 0.4s ease; }
  @keyframes modulex-iletisim-harita-perde-sallan { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-8px) rotate(-6deg); } }
  .modulex-iletisim-harita-perde-pyazi { position: absolute; inset-block-end: 0; inset-inline: 0; z-index: 1; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 18px; padding: clamp(16px, 3vw, 26px); border-block-start: 1px solid --cizgi--; background: --bg--; transition: opacity 0.4s ease, transform 0.4s ease; }
  .modulex-iletisim-harita-perde-petk { grid-column: 1; color: --muted--; font-size: 0.82rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .modulex-iletisim-harita-perde-padres { grid-column: 1; font-size: 1.12rem; font-weight: 700; overflow-wrap: anywhere; }
  .modulex-iletisim-harita-perde-yukle { grid-column: 2; grid-row: 1 / span 2; display: inline-grid; place-items: center; inline-size: 64px; block-size: 64px; border: 0; border-radius: 50%; background: --accent--; color: --accentText--; animation: modulex-iletisim-harita-perde-halka 2.2s ease-out infinite; transition: transform 0.2s ease; }
  .modulex-iletisim-harita-perde-yukle:hover { transform: scale(1.07); }
  .modulex-iletisim-harita-perde-yukle .material-symbols-outlined { font-size: 30px; }
  @keyframes modulex-iletisim-harita-perde-halka { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, --accent-- 45%, transparent); } 100% { box-shadow: 0 0 0 18px transparent; } }
  .modulex-iletisim-harita-perde--acik .modulex-iletisim-harita-perde-pyazi { opacity: 0; transform: translateY(100%); pointer-events: none; }
  .modulex-iletisim-harita-perde--acik .modulex-iletisim-harita-perde-sokak, .modulex-iletisim-harita-perde--acik .modulex-iletisim-harita-perde-hpin { opacity: 0; }
  .modulex-iletisim-harita-perde-perde .modulex-iletisim-harita-perde-iframe { z-index: 2; }
  .modulex-iletisim-harita-perde-yolgit { justify-self: start; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 18px; border: 1.5px solid --cizgi--; border-radius: 999px; color: inherit; font-weight: 700; text-decoration: none; transition: border-color 0.2s ease, gap 0.2s ease; }
  .modulex-iletisim-harita-perde-yolgit:hover { border-color: --accent--; gap: 12px; }
  .modulex-iletisim-harita-perde-yolgit .material-symbols-outlined { color: --accentInk--; font-size: 20px; }
  @media (max-width: 1024px) {
    .modulex-iletisim-harita-perde-sahne { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 768px) {
    .modulex-iletisim-harita-perde-pyazi { grid-template-columns: minmax(0, 1fr); }
    .modulex-iletisim-harita-perde-yukle { grid-column: 1; grid-row: auto; inline-size: 56px; block-size: 56px; }
  }
  .modulex-iletisim-harita-perde-kikon { flex: none; display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: color-mix(in srgb, --accent-- 14%, transparent); color: --accentInk--; font-size: 24px; }
  .modulex-iletisim-harita-perde-ketiket { display: block; color: --muted--; font-size: 0.82rem; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; }
  .modulex-iletisim-harita-perde-deger { color: inherit; font-weight: 650; text-decoration: none; overflow-wrap: anywhere; transition: color 0.2s ease; }
  a.modulex-iletisim-harita-perde-deger:hover { color: --accentInk--; text-decoration: underline; text-underline-offset: 4px; }
  .modulex-iletisim-harita-perde-eylem { display: inline-flex; align-items: center; gap: 6px; color: --accentInk--; font-weight: 700; text-decoration: none; transition: gap 0.2s ease; }
  .modulex-iletisim-harita-perde-eylem:hover { gap: 10px; }
  .modulex-iletisim-harita-perde-eylem .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-harita-perde-kopya { display: none; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: --text--; font: inherit; font-size: 0.85rem; font-weight: 650; transition: border-color 0.2s ease, background 0.2s ease; }
  .modulex-iletisim-harita-perde--kjs .modulex-iletisim-harita-perde-kopya { display: inline-flex; }
  .modulex-iletisim-harita-perde-kopya:hover { border-color: --accent--; }
  .modulex-iletisim-harita-perde-kopya .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-harita-perde--kopyalandi { background: color-mix(in srgb, --accent-- 14%, transparent); }
  .modulex-iletisim-harita-perde-sosyal { display: grid; gap: 10px; }
  .modulex-iletisim-harita-perde-sbaslik { color: --muted--; font-size: 0.9rem; font-weight: 650; }
  .modulex-iletisim-harita-perde-sliste { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-iletisim-harita-perde-cip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border: 1px solid --cizgi--; border-radius: 999px; color: inherit; font-weight: 650; text-decoration: none; transition: border-color 0.2s ease, transform 0.2s ease; }
  .modulex-iletisim-harita-perde-cip:hover { border-color: --accent--; transform: translateY(-2px); }
  .modulex-iletisim-harita-perde-cikon { font-size: 18px; }
  .modulex-iletisim-harita-perde-harita { position: relative; overflow: hidden; min-height: 280px; border-radius: --yuvarlak--; background: --kartBg--; }
  .modulex-iletisim-harita-perde-iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .modulex-iletisim-harita-perde-hdesen { position: absolute; inset: 0; display: grid; place-items: center; background-color: color-mix(in srgb, --accent-- 8%, --kartBg--); background-image: linear-gradient(color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), radial-gradient(circle at 30% 40%, color-mix(in srgb, --accent-- 18%, transparent) 0 18%, transparent 19%); background-size: 36px 36px, 36px 36px, 100% 100%; }
  .modulex-iletisim-harita-perde-pin { color: --accentInk--; font-size: 56px; animation: modulex-iletisim-harita-perde-zipla 2.4s ease-in-out infinite; }
  @keyframes modulex-iletisim-harita-perde-zipla { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .modulex-iletisim-harita-perde-hyol { position: absolute; inset-block-end: 16px; inset-inline-start: 16px; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 999px; background: --bg--; color: --text--; font-weight: 700; text-decoration: none; box-shadow: 0 6px 20px color-mix(in srgb, --text-- 16%, transparent); transition: transform 0.2s ease; }
  .modulex-iletisim-harita-perde-hyol:hover { transform: translateY(-2px); }
  .modulex-iletisim-harita-perde-hyol .material-symbols-outlined { font-size: 18px; color: --accentInk--; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-harita-perde :is(.modulex-iletisim-harita-perde-baslik, .modulex-iletisim-harita-perde-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-harita-perde-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-iletisim-harita-perde { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-iletisim-harita-perde *, .modulex-iletisim-harita-perde *::before, .modulex-iletisim-harita-perde *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-iletisim-harita-perde";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const haritaPerde = (s, P) => {
        s.querySelectorAll("[data-perde]").forEach((f) => {
          const b = f.querySelector("[data-perde-ac]");
          if (!b || !f.dataset.src) return;
          b.hidden = false;
          s.classList.add(P + "--pjs");
          b.addEventListener("click", () => {
            if (f.querySelector("iframe")) return;
            const i = document.createElement("iframe");
            i.className = P + "-iframe";
            i.src = f.dataset.src;
            i.title = f.dataset.baslik || "";
            i.loading = "lazy";
            i.referrerPolicy = "no-referrer-when-downgrade";
            f.append(i);
            f.classList.add(P + "--acik");
            b.setAttribute("aria-expanded", "true");
          });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      haritaPerde(s, P, az);
    });
  })();
</script>
